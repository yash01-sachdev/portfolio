<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>
    <link rel="stylesheet" href="../font.css" />
    <link rel="stylesheet" href="../output.css" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="min-h-screen bg-[#111] text-white font-['Nunito']">
    <main class="min-h-screen flex items-center justify-center px-4">
      <section
        class="w-full max-w-2xl rounded-[28px] border border-[#1788ae]/40 bg-[#0f1720] p-8 md:p-12 text-center shadow-[0_20px_80px_rgba(23,136,174,0.18)]"
      >
        <p class="inline-block rounded-full border border-[#1788ae] px-4 py-1 text-sm text-[#23b9eb]">
          Message Sent
        </p>
        <h1 class="mt-6 text-4xl md:text-5xl font-['Spartan'] font-bold">
          Thanks for reaching out.
        </h1>
        <p class="mt-4 text-lg text-[#b0b2c3] leading-8">
          Your message was sent successfully. I’ll get back to you soon.
        </p>
        <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
          <a
            href="/"
            class="bg-[#1788ae] hover:bg-[#1280a4] transition rounded-lg px-6 py-3 font-bold"
          >
            Back to Portfolio
          </a>
          <a
            href="https://mail.google.com/mail/?view=cm&fs=1&to=yashsachdev007@gmail.com"
            target="_blank"
            rel="noopener noreferrer"
            class="border border-[#1788ae] text-[#23b9eb] hover:bg-[#1788ae]/10 transition rounded-lg px-6 py-3 font-bold"
          >
            Email Directly
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
